name: Publish plugin release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4

      - name: Validate and package the plugin
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          grep -Fq "Version: ${version}" etch-content-hub-sort.php
          grep -Fq "Stable tag: ${version}" readme.txt
          grep -Fq "\$version = '${version}';" etch-content-hub-sort.php
          for file in etch-content-hub-sort.php uninstall.php includes/*.php; do php -l "$file"; done
          php -l includes/github-updates.php
          php tests/updater-smoke.php
          node --check assets/sort.js
          node --check assets/connections.js
          node --check assets/delta-graph.js
          node --check assets/vendor/webawesome/accordion.js
          php -l includes/connections.php
          git archive --format=zip --prefix=etch-content-hub-sort/ \
            -o "etch-content-hub-sort-${version}.zip" HEAD -- \
            etch-content-hub-sort.php includes assets readme.txt README.md LICENSE.txt NOTICE.txt CHANGELOG.md uninstall.php
          unzip -tq "etch-content-hub-sort-${version}.zip"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          gh release create "${RELEASE_TAG}" "etch-content-hub-sort-${version}.zip" \
            --title "Content Explorer for Etch ${version}" \
            --notes-file RELEASE-NOTES.md \
            --verify-tag
